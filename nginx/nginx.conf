# nginx/nginx.conf — Load balancer chính của hệ thống
# Đặt file này ở nginx/nginx.conf
# Nhiệm vụ:
#   - Nhận toàn bộ traffic từ port 80
#   - /api/* → proxy tới backend FastAPI (port 8000)
#   - /*     → proxy tới frontend nginx (port 80)

upstream backend_pool {
    server backend:8000;
    # Mở rộng sau: thêm dòng "server backend_2:8000;" để scale ngang
}

upstream frontend_pool {
    server frontend:80;
}

server {
    listen 80;

    # Tăng buffer size để tránh lỗi khi upload PDF lớn
    client_max_body_size 50M;

    # ── API → Backend ────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout cao hơn cho RAG query (LLM đôi khi chậm)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Frontend → React SPA ─────────────────────────────
    location / {
        proxy_pass         http://frontend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
