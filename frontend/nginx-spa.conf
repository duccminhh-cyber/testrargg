# nginx-spa.conf — đặt trong thư mục frontend/
# File này dành cho container frontend để serve static React build
# Có SPA fallback: mọi route đều trả về index.html để React Router xử lý

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — nếu file không tồn tại thì trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (js, css, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tắt access log cho favicon (giảm noise)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
