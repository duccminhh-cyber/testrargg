services:

  # ── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Override để trỏ đúng hostname container thay vì localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL:    redis://redis:6379/0
      QDRANT_URL:   http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Không expose port ra ngoài — chỉ nginx mới gọi vào backend
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    # Override CMD mặc định (uvicorn) → chạy Celery thay vào
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL:    redis://redis:6379/0
      QDRANT_URL:   http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "80"

  # ── Load Balancer (entry point duy nhất) ──────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"      # Entry point duy nhất cho toàn hệ thống
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ── Triển khai Internet & Giám sát (Bonus) ──────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://nginx:80
    restart: unless-stopped
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"      # Truy cập Dashboard tại localhost:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123  # Pass mặc định là admin123
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Backup Tự động (Bonus) ────────────────────────────────────
  pg-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    volumes:
      - db_backups:/backups
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragpassword}
      - SCHEDULE=@every 12h
      - BACKUP_KEEP_DAYS=7

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  db_backups:
