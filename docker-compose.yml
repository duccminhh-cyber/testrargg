services:

  # ── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    # ✅ Bỏ ports — không expose ra ngoài, chỉ dùng nội bộ
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      # ✅ Chỉ giữ console port 9001 cho dev, bỏ 9000 ra ngoài
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: testrargg/rag-backend:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL:    redis://redis:6379/0
      QDRANT_URL:   http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: testrargg/rag-backend:local
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL:    redis://redis:6379/0
      QDRANT_URL:   http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ducminhisme/rag-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "80"

  # ── Load Balancer ─────────────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started  # ✅ Chờ backend start xong mới chạy nginx
      frontend:
        condition: service_started
    restart: unless-stopped

  # ── Bonus: Internet, Monitoring, Backup ──────────────────

  cloudflared:
    image: cloudflare/cloudflared:latest
    # ✅ Dùng named tunnel nếu có token, fallback quick tunnel cho dev
    command: tunnel --url http://nginx:80
    # Nếu có token thật, thay bằng:
    # command: tunnel run
    # environment:
    #   - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus  # ✅ Thêm volume để giữ data
    restart: unless-stopped
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana  # ✅ Thêm volume để giữ dashboard
    depends_on:
      - prometheus
    restart: unless-stopped

  pg-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    volumes:
      - db_backups:/backups
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragpassword}
      - SCHEDULE=@every 12h
      - BACKUP_KEEP_DAYS=7

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  db_backups:
  prometheus_data:  # ✅ Thêm mới
  grafana_data:     # ✅ Thêm mới
